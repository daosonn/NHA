<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline — scroll motion (handoff)</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
/*
  ============================================================
  TIMELINE — HIỆU ỨNG MOTION KHI LƯỚT (handoff cho FE)
  ============================================================

  Ý TƯỞNG TỔNG THỂ
  ----------------
  Mọi hiệu ứng đều gắn với VỊ TRÍ CUỘN, không phải thời gian.
  Mỗi frame cuộn ta tính lại cho từng card:

  1. t  = tiến độ "đi vào" màn hình (0 → 1 khi card nhô lên từ đáy,
          hoàn tất khi đỉnh card đi hết 30% chiều cao viewport).
          Ease-out bậc 3: t = 1 - (1-t)^3 → vào nhanh, dừng êm.
  2. u  = tiến độ "đi ra" ở đỉnh (mờ dần khi card trôi khỏi đầu trang).
  3. o  = min(t, u) → độ hiện tổng hợp của card.
  4. f  = độ gần "tâm nhìn" (điểm 42% chiều cao viewport):
          f = 1 tại tâm, giảm tuyến tính về 0 ở xa.
          → dùng cho MỌI hiệu ứng nhấn mạnh: card gần tâm thì
          to hơn (scale 0.965→1), đậm hơn (opacity, grayscale 0.5→0).

  CARD ACTIVE (một card duy nhất tại một thời điểm)
  -------------------------------------------------
  activeIdx = card có f lớn nhất (và o > 0.1 — phải đang nhìn thấy).
  Card active nhận:
    - chấm (dot) phồng scale(1.5) + viền san hô + vòng pulse (halo)
    - tam giác SVG chĩa vào chấm fade-in (opacity 0 → 1)
    - bar dọc 4px màu san hô ở viền trái card (inset box-shadow)
  Card thường: mọi thứ trên trả về trạng thái mặc định MỖI FRAME —
  vì thế không bao giờ "sót" style cũ.

  VẠCH TIMELINE ĐỔ MÀU (progress rail)
  ------------------------------------
  Hai lớp vạch chồng nhau: lớp xám tĩnh + lớp gradient san hô.
  Chiều cao lớp màu = vị trí TÂM CHẤM của card active so với rail
  (không tô quá chấm cuối). CSS transition height 380ms làm nó
  trượt mượt giữa các chấm thay vì nhảy.

  KHI CHẠM ĐÁY (atEnd)
  --------------------
  scrollTop + clientHeight >= scrollHeight - 8 → ép card cuối
  thành active (vì nó không bao giờ tới được tâm nhìn) và bỏ mờ.

  PARALLAX ẢNH
  ------------
  Ảnh đặt trong khung overflow:hidden, lớp ảnh cao hơn khung 32px
  (inset: -16px 0). Mỗi frame dịch translateY theo khoảng cách
  tâm card ↔ tâm viewport, hệ số ~14px → ảnh trôi chậm hơn card.

  QUÁN TÍNH (momentum tail)
  -------------------------
  Sau khi ngừng cuộn, còn vận tốc thì tiếp tục chạy rAF với
  vel *= 0.85 mỗi frame cho hiệu ứng "hạ cánh" mượt (không bắt buộc).

  HIỆU NĂNG
  ---------
  - Chỉ 1 scroll listener (passive) + gộp về 1 requestAnimationFrame.
  - Chỉ đụng transform / opacity / box-shadow → không reflow layout.
  - will-change: transform, opacity trên card.

  ẢNH THẬT NHIỀU KÍCH THƯỚC
  -------------------------
  Nguyên tắc: KHUNG CỐ ĐỊNH + object-fit: cover.
  1 ảnh  → khung ngang full-width cao 110px.
  n ảnh  → ô vuông 92px đều nhau, ô cuối phủ tối + "+N".
  Ảnh dọc/ngang gì cũng bị crop đầy khung → layout không vỡ.
*/
*{box-sizing:border-box}
body{margin:0;background:#EDEBE7;font-family:'Be Vietnam Pro',sans-serif;display:flex;justify-content:center;padding:48px 16px}
.phone{width:393px;height:852px;position:relative;background:#FAF9F8;border-radius:44px;overflow:hidden;border:1px solid rgba(24,24,27,.08);box-shadow:0 24px 60px rgba(24,24,27,.14)}
.tl-scroll{scrollbar-width:none}
.tl-scroll::-webkit-scrollbar{display:none}
@keyframes tlPulse{0%{box-shadow:0 0 0 0 rgba(240,112,95,.35)}70%{box-shadow:0 0 0 12px rgba(240,112,95,0)}100%{box-shadow:0 0 0 0 rgba(240,112,95,0)}}
.ph{background:repeating-linear-gradient(135deg,#EFEDEA 0 8px,#E4E1DC 8px 16px);display:flex;align-items:center;justify-content:center;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#A1A1AA}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useRef, useEffect, createElement: h } = React;

/* ---------- dữ liệu demo ---------- */
const ENTRIES = [
  { year: '2021', title: 'Family trip to Da Lat', desc: 'Three generations, one minivan.', photo: 'TRIP PHOTO', by: 'Lan added this memory' },
  { year: '2012', title: 'Minh was born', desc: 'The workshop closed early that day.', photo: 'FIRST PHOTO', by: 'Mom added this memory' },
  { year: '2005', title: 'Opened the carpentry workshop', desc: 'Two saws, one apprentice, and the smell of sawdust every afternoon.', grid: 3, extra: 3, by: 'Minh added 4 photos' },
  { year: '1998', title: 'Married Mom in Nam Dinh', desc: 'A small ceremony at the family house.', photo: 'WEDDING PHOTO', by: 'Mom added this memory' },
  { year: '1990', title: 'Moved the family to Hanoi', desc: 'Two suitcases and a bicycle on the train.' },
  { year: '1964', title: 'Born in Y Yen, Nam Dinh' },
];

/* ============================================================
   HOOK: useScrollMotion — toàn bộ "phần hồn" nằm ở đây.
   Trả về ref gắn vào khung cuộn; tự gắn listener + rAF loop.
   ============================================================ */
function useScrollMotion() {
  const scRef = useRef(null);
  useEffect(() => {
    const sc = scRef.current;
    if (!sc) return;
    let vel = 0, lastTop = sc.scrollTop, lastT = performance.now(), raf = 0;

    function update() {
      raf = 0;
      const cr = sc.getBoundingClientRect(), vh = cr.height;
      const cards = sc.querySelectorAll('[data-tl-card]');
      let activeIdx = -1, bestF = -1;

      cards.forEach((card, i) => {
        const r = card.getBoundingClientRect();
        const top = r.top - cr.top, bot = r.bottom - cr.top;

        // (1) tiến độ đi vào từ đáy — ease-out bậc 3
        let t = Math.min(1, Math.max(0, (vh - top) / (vh * 0.3)));
        t = 1 - Math.pow(1 - t, 3);
        // (2) tiến độ đi ra ở đỉnh
        const u = Math.min(1, Math.max(0, bot / (vh * 0.22)));
        const o = Math.min(t, u);
        // (4) độ gần tâm nhìn (42% viewport)
        const mid = (top + bot) / 2;
        const f = Math.max(0, 1 - Math.abs(mid - vh * 0.42) / (vh * 0.55));

        // áp dụng: mờ/đậm + trượt lên + to/nhỏ + nhạt màu
        card.style.opacity = (o * (0.65 + 0.35 * f)).toFixed(3);
        card.style.transform =
          'translateY(' + ((1 - t) * 24).toFixed(1) + 'px) scale(' +
          (0.965 + 0.035 * Math.min(o, f)).toFixed(3) + ')';
        card.style.filter = 'grayscale(' + ((1 - f) * 0.5).toFixed(2) + ')';

        // parallax ảnh — ảnh trôi ngược chiều, chậm hơn
        const par = card.querySelector('[data-tl-parallax]');
        if (par) par.style.transform =
          'translateY(' + ((((top + bot) / 2 - vh / 2) / vh) * -14).toFixed(1) + 'px)';

        // chọn card active: f lớn nhất và còn nhìn thấy
        if (f > bestF && o > 0.1) { bestF = f; activeIdx = i; }

        // reset trạng thái thường MỖI FRAME (tránh sót style)
        const dot = card.querySelector('[data-tl-dot]');
        const halo = card.querySelector('[data-tl-halo]');
        const tail = card.querySelector('[data-tl-link]');
        if (dot) { dot.style.boxShadow = 'inset 0 0 0 3px #D4D4D8'; dot.style.transform = 'scale(1)'; }
        if (halo) halo.style.opacity = '0';
        if (tail) tail.style.opacity = '0';
        card.style.boxShadow = '0 8px 24px rgba(24,24,27,0.05), inset 0 0 0 1px rgba(24,24,27,0.06)';
      });

      // chạm đáy → card cuối là active (nó không bao giờ tới tâm nhìn)
      const atEnd = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 8;
      if (atEnd && cards.length) activeIdx = cards.length - 1;

      const rail = sc.querySelector('[data-tl-rail]');
      const prog = sc.querySelector('[data-tl-prog]');
      if (activeIdx >= 0) {
        const card = cards[activeIdx];
        if (atEnd) { // bỏ mờ card cuối khi chạm đáy
          card.style.opacity = '1'; card.style.filter = 'grayscale(0)';
          card.style.transform = 'translateY(0) scale(1)';
        }
        const dot = card.querySelector('[data-tl-dot]');
        const halo = card.querySelector('[data-tl-halo]');
        const tail = card.querySelector('[data-tl-link]');
        // chấm phồng + pulse
        if (dot) { dot.style.boxShadow = 'inset 0 0 0 3.5px #F0705F'; dot.style.transform = 'scale(1.5)'; }
        if (halo) halo.style.opacity = '1';
        // tam giác hiện + bar dọc viền trái (inset shadow, không đổi nền)
        if (tail) tail.style.opacity = '1';
        card.style.boxShadow =
          'inset 4px 0 0 #F58B7B, 0 8px 24px rgba(24,24,27,0.05), inset 0 0 0 1px rgba(24,24,27,0.06)';
        // vạch đổ màu ĐẾN TÂM CHẤM của card active (không tô quá)
        if (rail && prog && dot) {
          const rr = rail.getBoundingClientRect();
          const dr = dot.getBoundingClientRect();
          const p = Math.min(1, Math.max(0, (dr.top + dr.height / 2 - rr.top) / rr.height));
          prog.style.height = (p * 100).toFixed(2) + '%';
        }
      } else if (prog) prog.style.height = '0%';

      // đuôi quán tính: còn vận tốc thì chạy tiếp vài frame
      if (Math.abs(vel) > 0.02) {
        vel *= 0.85;
        if (!raf) raf = requestAnimationFrame(update);
      } else vel = 0;
    }

    function onScroll() {
      const now = performance.now(), st = sc.scrollTop;
      vel = (st - lastTop) / Math.max(1, now - lastT);
      lastTop = st; lastT = now;
      if (!raf) raf = requestAnimationFrame(update);
    }

    sc.addEventListener('scroll', onScroll, { passive: true });
    requestAnimationFrame(update); // frame đầu
    return () => { sc.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);
  return scRef;
}

/* ---------- các mảnh UI ---------- */

// Chấm + halo + tam giác — đặt absolute bên trái mỗi card
function DotAndTail() {
  return h(React.Fragment, null,
    h('div', { 'data-tl-dot': '', style: {
      position: 'absolute', left: -32, top: 20, width: 12, height: 12, borderRadius: 999,
      background: '#FFFFFF', boxShadow: 'inset 0 0 0 3px #D4D4D8',
      transition: 'box-shadow 240ms, transform 300ms cubic-bezier(.34,1.56,.64,1)' } },
      h('div', { 'data-tl-halo': '', style: {
        position: 'absolute', inset: 0, borderRadius: 999, opacity: 0,
        transition: 'opacity 300ms', animation: 'tlPulse 2.6s ease-out infinite' } })),
    // tam giác SVG: mũi nhọn chĩa vào chấm, chỉ hiện khi active
    h('svg', { 'data-tl-link': '', width: 13, height: 16, viewBox: '0 0 13 16', style: {
      position: 'absolute', left: -11, top: 18, overflow: 'visible', opacity: 0, transition: 'opacity 300ms' } },
      h('path', { d: 'M13 0.5 L1 8 L13 15.5 Z', fill: '#F58B7B' }))
  );
}

function Card(e) {
  return h('div', { 'data-tl-card': '', 'data-tl-year': e.year, style: {
    position: 'relative', width: 321, background: '#FFFFFF', borderRadius: 20, padding: 14,
    display: 'flex', flexDirection: 'column', gap: 10,
    boxShadow: '0 8px 24px rgba(24,24,27,0.05), inset 0 0 0 1px rgba(24,24,27,0.06)',
    willChange: 'transform, opacity',
    // tâm scale đặt tại vị trí chấm → chấm không trôi khỏi vạch khi card to/nhỏ
    transformOrigin: '-26px 26px',
    transition: 'box-shadow 320ms' } },
    h(DotAndTail),
    h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
      h('div', { style: {
        alignSelf: 'flex-start', height: 24, padding: '0 10px', borderRadius: 999,
        background: '#FEF3F1', display: 'flex', alignItems: 'center',
        font: "600 14px/16px Lora, Georgia, serif", letterSpacing: '0.8px', color: '#B8422F' } }, e.year)),
    h('span', { style: { font: "600 15px/21px 'Be Vietnam Pro', sans-serif", letterSpacing: '-0.1px', color: '#18181B' } }, e.title),
    e.desc && h('span', { style: { font: "400 13px/20px 'Be Vietnam Pro', sans-serif", color: '#71717A' } }, e.desc),
    // 1 ảnh: khung ngang cố định 110px + lớp parallax cao hơn khung (inset -16px)
    e.photo && h('div', { style: { height: 110, borderRadius: 14, overflow: 'hidden', boxShadow: 'inset 0 0 0 1px rgba(24,24,27,0.06)', position: 'relative' } },
      h('div', { 'data-tl-parallax': '', className: 'ph', style: { position: 'absolute', inset: '-16px 0', willChange: 'transform' } }, e.photo)),
    // nhiều ảnh: ô vuông đều + ô cuối "+N"
    e.grid && h('div', { style: { display: 'flex', gap: 8 } },
      ...Array.from({ length: e.grid }, (_, i) =>
        i < e.grid - 1
          ? h('div', { key: i, className: 'ph', style: { width: 92, height: 92, borderRadius: 12 } })
          : h('div', { key: i, style: { position: 'relative', width: 92, height: 92, borderRadius: 12, overflow: 'hidden' } },
              h('div', { className: 'ph', style: { position: 'absolute', inset: 0 } }),
              h('div', { style: { position: 'absolute', inset: 0, background: 'rgba(24,24,27,0.45)', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                h('span', { style: { font: "700 14px/1 'Be Vietnam Pro', sans-serif", color: '#FFFFFF' } }, '+' + e.extra))))),
    e.by && h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, paddingTop: 2 } },
      h('div', { className: 'ph', style: { width: 20, height: 20, borderRadius: 999 } }),
      h('span', { style: { font: "500 12px/16px 'Be Vietnam Pro', sans-serif", color: '#A1A1AA' } }, e.by))
  );
}

function App() {
  const scRef = useScrollMotion();
  return h('div', { className: 'phone' },
    h('div', { style: { height: 62, padding: '0 30px 8px', display: 'flex', alignItems: 'flex-end' } },
      h('span', { style: { font: "600 15px/18px 'Be Vietnam Pro', sans-serif", color: '#18181B' } }, '9:41')),
    h('div', { style: { height: 56, padding: '0 20px', display: 'flex', alignItems: 'center' } },
      h('span', { style: { font: "700 17px/24px 'Be Vietnam Pro', sans-serif", color: '#18181B' } }, 'Nguyen Van An')),
    // KHUNG CUỘN — chú ý margin/padding âm hai bên để chấm phồng
    // và bóng card không bị cắt bởi overflow
    h('div', { className: 'tl-scroll', ref: scRef, style: {
      height: 700, margin: '4px -12px 0 0', padding: '0 12px 40px 20px',
      overflowY: 'auto', position: 'relative' } },
      h('div', { style: { padding: '0 0 16px 36px' } },
        h('span', { style: { font: "600 26px/34px Lora, Georgia, serif", color: '#18181B' } }, "Dad's journey")),
      // RAIL: lớp xám + lớp màu (data-tl-prog) chồng nhau
      h('div', { 'data-tl-rail': '', style: {
        position: 'relative', marginLeft: 0, paddingLeft: 52, paddingBottom: 24,
        display: 'flex', flexDirection: 'column', gap: 16 } },
        h('div', { style: { position: 'absolute', left: 25, top: 6, bottom: 0, width: 2, borderRadius: 999, background: '#E4E4E7' } }),
        h('div', { 'data-tl-prog': '', style: {
          position: 'absolute', left: 25, top: 6, height: '0%', width: 2, borderRadius: 999,
          background: 'linear-gradient(180deg,#F58B7B 0%,#F0705F 100%)',
          transition: 'height 380ms cubic-bezier(.22,1,.36,1)' } }),
        ...ENTRIES.map((e) => h(Card, { key: e.year, ...e }))))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
