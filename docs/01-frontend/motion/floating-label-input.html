<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Floating label input</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:60px;background:#EDEBE7;font-family:'Be Vietnam Pro',sans-serif;display:flex;justify-content:center}
.field{position:relative;width:280px}
.field input{width:100%;box-sizing:border-box;height:56px;padding:22px 16px 8px;border-radius:14px;border:1.5px solid #E7E1DC;background:#FFFFFF;font:500 15px/1 'Be Vietnam Pro',sans-serif;color:#18181B;outline:none;transition:border-color 200ms cubic-bezier(.4,0,.2,1),box-shadow 200ms cubic-bezier(.4,0,.2,1)}
.field input:focus{border-color:#F58B7B;box-shadow:0 0 0 3px rgba(245,139,123,.18)}
.field label{position:absolute;left:16px;top:18px;font:500 15px/1 'Be Vietnam Pro',sans-serif;color:#8A857E;pointer-events:none;transform-origin:left top;transition:transform 200ms cubic-bezier(.34,1.56,.64,1),color 200ms cubic-bezier(.4,0,.2,1)}
.field input:focus + label,
.field input.has-value + label{
  transform:translateY(-10px) scale(.72);
  color:#B8422F;
}
</style>
</head>
<body>

<div class="field">
  <input type="text" id="nameInput" placeholder=" ">
  <label for="nameInput">Tên người nhận</label>
</div>

<script>
const input = document.getElementById('nameInput');
function sync() { input.classList.toggle('has-value', input.value.length > 0); }
input.addEventListener('input', sync);
sync();
</script>
</body>
</html>
