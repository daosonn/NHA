version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nha_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nha_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
