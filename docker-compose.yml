services:
  postgres:
    image: postgres:17-alpine
    container_name: nha-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nha_password}
      POSTGRES_DB: ${POSTGRES_DB:-nha}

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
